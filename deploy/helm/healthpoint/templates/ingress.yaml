{{- if .Values.ingress.enabled }}
# Plain Ingress for the API gateway tier (APISIX ingress class by default).
# In the reference topology, TLS terminates at Caddy at the edge and APISIX
# routes to the server service; enable this only if you manage routes via the
# Kubernetes Ingress API rather than APISIX CRDs.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "healthpoint.fullname" . }}-server
  labels:
    {{- include "healthpoint.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "healthpoint.fullname" . }}-server
                port:
                  number: {{ .Values.server.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "healthpoint.fullname" . }}-server
                port:
                  number: {{ .Values.server.service.port }}
{{- end }}

# HealthPoint — Kubernetes Secrets TEMPLATE
#
# This file is a TEMPLATE with placeholder values. It exists so the required
# key names are reviewable in version control. Do NOT put real values here and
# do NOT `kubectl apply` this file as-is.
#
# How to use:
#   1. Copy to a scratch location OUTSIDE the repo (or pipe via stdin).
#   2. Fill in real values (see docs/SECRETS.md for generation commands).
#   3. Create the Secret via one of:
#        a. kubectl create secret generic ... --from-literal=... (see docs/SECRETS.md)
#        b. kubeseal (sealed-secrets) — commit only the resulting SealedSecret
#        c. external-secrets operator (ExternalSecret + ClusterSecretStore)
#
# The Helm chart (deploy/helm/healthpoint) references this Secret by name
# (secrets.name, default "healthpoint-secrets") via secretKeyRef only.

apiVersion: v1
kind: Secret
metadata:
  name: healthpoint-secrets
  namespace: healthpoint
  labels:
    app.kubernetes.io/part-of: healthpoint
type: Opaque
stringData:
  # ── Core application (REQUIRED; startup fails closed without these) ────────
  # postgresql://user:pass@host:5432/dbname — use sslmode=verify-ca in prod
  database-url: "REPLACE_ME_postgresql_connection_string"
  # openssl rand -hex 32
  jwt-secret: "REPLACE_ME_min_32_char_random"
  # redis://:<password>@host:6379
  redis-url: "REPLACE_ME_redis_url_with_password"
  # Bearer fallback for /api/scheduled/* — openssl rand -hex 32
  scheduled-secret: "REPLACE_ME_min_32_char_random"

  # ── Keycloak OIDC ──────────────────────────────────────────────────────────
  # From Keycloak admin console → Clients → healthpoint-app → Credentials
  keycloak-client-secret: "REPLACE_ME_keycloak_client_secret"

  # ── Settlement provider callbacks (REQUIRED in production) ────────────────
  settlement-callback-secret: "REPLACE_ME_hmac_secret"
  # Versioned keyring, e.g. key1=<hex>,key2=<hex>
  settlement-callback-keyring: "REPLACE_ME_versioned_keyring_json_or_kv"
  # PEM of CA that signs provider mTLS client certs (multi-line PEM OK)
  settlement-mtls-client-ca-pem: "REPLACE_ME_ca_pem"
  # Comma-separated SHA-256 fingerprints of allowed provider client certs
  settlement-mtls-client-fingerprints: "REPLACE_ME_comma_separated_sha256"
  # >= 32 chars, verified at the mTLS ingress — openssl rand -hex 32
  settlement-mtls-ingress-token: "REPLACE_ME_min_32_char_random"

  # ── Internal service-to-service ────────────────────────────────────────────
  internal-service-token: "REPLACE_ME_min_32_char_random"

  # ── Object storage (MinIO/S3) ──────────────────────────────────────────────
  s3-access-key: "REPLACE_ME_s3_access_key"
  s3-secret-key: "REPLACE_ME_s3_secret_key"

  # ── Optional / feature-gated ───────────────────────────────────────────────
  # Required only when TEMPORAL_AUTH_TOKEN-enabled Temporal Cloud/mTLS is used
  temporal-auth-token: "REPLACE_ME_optional"
  # Required only for AI features (OpenAI-compatible endpoint)
  llm-api-key: "REPLACE_ME_optional"
  # Required for backup encryption (see docker-compose.deploy.yml)
  backup-encryption-passphrase: "REPLACE_ME_optional"
  # 64-char hex AES-256 key for stored EMR credentials — openssl rand -hex 32
  emr-credentials-encryption-key: "REPLACE_ME_64_char_hex"

---
# TLS certificate for the optional Ingress (deploy/helm/healthpoint).
# Preferred: cert-manager. If created manually:
#   kubectl create secret tls healthpoint-tls --cert=tls.crt --key=tls.key -n healthpoint
apiVersion: v1
kind: Secret
metadata:
  name: healthpoint-tls
  namespace: healthpoint
type: kubernetes.io/tls
stringData:
  tls.crt: "REPLACE_ME_or_use_cert_manager"
  tls.key: "REPLACE_ME_or_use_cert_manager"

# HealthPoint IDR Platform — Helm Values (LEGACY CHART)
# This chart is superseded by deploy/helm/healthpoint/ (pinned images, no
# Dapr/Fluvio). It is kept for reference only.
# Override any value with: helm install idr-platform ./helm/idr-platform -f my-values.yaml

global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: "standard"
  namespace: idr

# ── IDR Application ───────────────────────────────────────────────────────────
app:
  enabled: true
  replicaCount: 2
  image:
    repository: healthpoint/idr-app
    tag: ""  # REQUIRED: set an immutable release tag or digest (never "latest")
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  env:
    NODE_ENV: production
    PORT: "3000"
  envSecrets:
    - name: DATABASE_URL
      secretName: idr-secrets
      secretKey: database-url
    - name: JWT_SECRET
      secretName: idr-secrets
      secretKey: jwt-secret
    - name: KEYCLOAK_URL
      secretName: idr-secrets
      secretKey: keycloak-url
    - name: KEYCLOAK_REALM
      secretName: idr-secrets
      secretKey: keycloak-realm
    - name: KEYCLOAK_CLIENT_ID
      secretName: idr-secrets
      secretKey: keycloak-client-id
    - name: KEYCLOAK_CLIENT_SECRET
      secretName: idr-secrets
      secretKey: keycloak-client-secret
    - name: REDIS_URL
      secretName: idr-secrets
      secretKey: redis-url
    - name: KAFKA_BROKERS
      secretName: idr-secrets
      secretKey: kafka-brokers
    - name: OPENSEARCH_URL
      secretName: idr-secrets
      secretKey: opensearch-url
    - name: PERMIFY_URL
      secretName: idr-secrets
      secretKey: permify-url
    - name: TEMPORAL_HOST
      secretName: idr-secrets
      secretKey: temporal-host
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# ── Go Services ───────────────────────────────────────────────────────────────
goServices:
  enabled: true
  replicaCount: 2
  image:
    repository: healthpoint/idr-go-services
    tag: ""  # REQUIRED: set an immutable release tag or digest (never "latest")
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8090
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# ── Rust Services ─────────────────────────────────────────────────────────────
rustServices:
  enabled: true
  replicaCount: 2
  image:
    repository: healthpoint/idr-rust-services
    tag: ""  # REQUIRED: set an immutable release tag or digest (never "latest")
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# ── Temporal Worker (Python) ──────────────────────────────────────────────────
temporalWorker:
  enabled: true
  replicaCount: 2
  image:
    repository: healthpoint/idr-temporal-worker
    tag: ""  # REQUIRED: set an immutable release tag or digest (never "latest")
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

# ── Lakehouse Pipeline (Python) ───────────────────────────────────────────────
lakehousePipeline:
  enabled: true
  replicaCount: 1
  image:
    repository: healthpoint/idr-lakehouse
    tag: ""  # REQUIRED: set an immutable release tag or digest (never "latest")
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "8Gi"

# ── PostgreSQL ────────────────────────────────────────────────────────────────
postgresql:
  enabled: true
  auth:
    postgresPassword: ""  # Set via secret
    database: idr
  primary:
    persistence:
      enabled: true
      size: 20Gi
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2000m"
        memory: "4Gi"

# ── Kafka ─────────────────────────────────────────────────────────────────────
kafka:
  enabled: true
  replicaCount: 3
  persistence:
    enabled: true
    size: 20Gi
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
  zookeeper:
    enabled: false
  kraft:
    enabled: true

# ── Redis ─────────────────────────────────────────────────────────────────────
redis:
  enabled: true
  architecture: replication
  auth:
    enabled: true
    password: ""  # Set via secret
  master:
    persistence:
      enabled: true
      size: 5Gi
  replica:
    replicaCount: 2

# ── OpenSearch ────────────────────────────────────────────────────────────────
opensearch:
  enabled: true
  replicas: 3
  persistence:
    enabled: true
    size: 30Gi
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

# ── Keycloak ──────────────────────────────────────────────────────────────────
# Audit P1 (2026-09-05): production mode. The Bitnami subchart runs Keycloak
# with `kc.sh start` (production) against the shared PostgreSQL `keycloak`
# database — NOT start-dev/dev-mem, which are development-only and lose all
# realm/user state on restart while disabling hostname/HTTPS enforcement.
# `production: true` makes the chart require `hostname` and TLS-related
# settings explicitly, matching the compose service's KC_DB=postgres +
# KC_HOSTNAME_STRICT hardening.
keycloak:
  enabled: true
  production: true
  # REQUIRED in production: the public base URL of this Keycloak. The chart
  # fails templating without it when production=true — that is intentional.
  hostname: ""   # e.g. keycloak.example.com (https implied; TLS at edge)
  # Caddy terminates TLS and forwards X-Forwarded-* headers.
  proxyHeaders: xforwarded
  # KC_HOSTNAME_STRICT equivalent: chart 21.x sets KC_HOSTNAME_STRICT=true
  # automatically when production=true; keep it that way.
  auth:
    adminUser: admin
    adminPassword: ""  # Set via secret — NO default admin password
  postgresql:
    enabled: false  # Use the shared PostgreSQL instance
  externalDatabase:
    host: "{{ .Release.Name }}-postgresql"
    port: 5432
    database: keycloak
    user: keycloak
    password: ""  # Set via secret — dedicated keycloak DB credentials
  extraEnvVars:
    # Runtime health/metrics endpoints (Keycloak management port 9000).
    - name: KC_HEALTH_ENABLED
      value: "true"
    - name: KC_METRICS_ENABLED
      value: "true"
  replicaCount: 2
  service:
    type: ClusterIP
    port: 80

# ── Temporal ──────────────────────────────────────────────────────────────────
temporal:
  enabled: true
  server:
    replicaCount: 1
  admintools:
    enabled: true
  web:
    enabled: true
  cassandra:
    enabled: false
  mysql:
    enabled: false
  postgresql:
    enabled: false  # Use the shared PostgreSQL instance
    host: "{{ .Release.Name }}-postgresql"
    port: 5432
    database: temporal
    user: temporal
    password: ""  # Set via secret

# ── Permify ───────────────────────────────────────────────────────────────────
permify:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/permify/permify
    tag: ""  # REQUIRED: pin a registry-verified tag/digest (never "latest")
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    httpPort: 3476
    grpcPort: 3478
  database:
    engine: postgres
    uri: ""  # Set via secret

# ── APISIX ────────────────────────────────────────────────────────────────────
apisix:
  enabled: true
  replicaCount: 2
  image:
    repository: apache/apisix
    tag: "3.9.1-debian"
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 80
    tlsPort: 443
  admin:
    enabled: true
    port: 9180
  etcd:
    enabled: true
    replicaCount: 3

# ── OpenAppsec ────────────────────────────────────────────────────────────────
# Audit P1 / ADR-003 (one-WAF decision, 2026-09-05): DISABLED. Caddy's
# embedded Coraza (OWASP CRS) is the single WAF; templates/caddy.yaml proxies
# directly to APISIX. Re-enable only together with re-pointing the Caddy
# reverse_proxy at the openappsec hop (see ADR-003 in
# infra/ARCHITECTURE-DECISIONS.md); the `latest`-tagged openappsec image must
# be pinned before any re-enable.
openappsec:
  enabled: false
  replicaCount: 2
  image:
    repository: openappsec/nginx
    tag: ""  # REQUIRED: pin a registry-verified tag/digest (never "latest")
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80

# ── TigerBeetle ───────────────────────────────────────────────────────────────
tigerbeetle:
  enabled: true
  replicaCount: 3
  image:
    repository: ghcr.io/tigerbeetle/tigerbeetle
    tag: "0.16.11"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 50Gi
  service:
    type: ClusterIP
    port: 3000

# ── Mojaloop ──────────────────────────────────────────────────────────────────
mojaloop:
  enabled: false  # Enable when payment interoperability is needed
  centralLedger:
    enabled: true
  centralSettlement:
    enabled: true

# ── MinIO (Lakehouse object storage) ─────────────────────────────────────────
minio:
  enabled: true
  mode: distributed
  replicas: 4
  persistence:
    enabled: true
    size: 100Gi
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"

# ── Caddy Edge Layer ─────────────────────────────────────────────────────────
caddy:
  enabled: true
  image:
    repository: healthpoint/caddy
    tag: "2.9"
    pullPolicy: IfNotPresent
  replicas: 2
  domain: idr.healthpoint.io
  adminEmail: admin@healthpoint.io
  acmeDnsProvider: cloudflare
  keycloakRealm: healthpoint
  layer4:
    kafka:
      port: 9093
    temporal:
      port: 7234
    tigerBeetle:
      port: 3001
    redis:
      port: 6380
    opensearch:
      port: 9201
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  persistence:
    enabled: true
    size: 1Gi
  internalCaSecret: caddy-internal-ca

# ── Internal mTLS (cert-manager) ─────────────────────────────────────────────
# Audit P1 (2026-09-05): when enabled, templates/certificates.yaml renders a
# cert-manager v1 CA Issuer (backed by caddy.internalCaSecret — the internal
# CA the Caddy layer-4 mTLS listeners already trust) plus Certificate
# resources issuing service certs for kafka / temporal / tigerbeetle / redis /
# opensearch into `<release>-<svc>-tls` Secrets. templates/internal-ca.yaml
# (P1-5) bootstraps that CA from a self-signed ClusterIssuer when
# internalMtls.bootstrap=true; set bootstrap=false when the CA Secret is
# provisioned out-of-band (Vault/KMS/sealed-secrets). Requires cert-manager
# v1 CRDs in the cluster. Default OFF — enable with
# --set internalMtls.enabled=true after cert-manager is installed.
internalMtls:
  enabled: false
  bootstrap: true   # internal-ca.yaml: self-signed root CA bootstrap
  caSecretName: ""   # default: .Values.caddy.internalCaSecret
  duration: "2160h"  # 90 days
  renewBefore: "360h"  # 15 days

# ── Legacy nginx Ingress (disabled — Caddy replaces it) ──────────────────────
ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
  hosts:
    - host: idr.healthpoint.io
      paths:
        - path: /
          pathType: Prefix
          service: app
  tls:
    - secretName: idr-tls
      hosts:
        - idr.healthpoint.io

# ── Monitoring ────────────────────────────────────────────────────────────────
monitoring:
  enabled: true
  prometheus:
    enabled: true
  grafana:
    enabled: true
  serviceMonitor:
    enabled: true

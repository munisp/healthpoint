###############################################################################
# HealthPoint IDR Platform — PRODUCTION HA OVERLAY
#
# Usage:   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Requires: Docker Compose >= v2.24 (uses the `!reset` / `!override` YAML tags).
#
# What changes vs the dev stack:
#   * PostgreSQL: primary + streaming replica (official postgres:16.4-alpine,
#     pg_basebackup clone, env-configurable credentials).
#   * Redis: master + replica + 3 Sentinels (quorum 2). The app follows
#     failover via REDIS_SENTINELS/REDIS_MASTER_NAME (see server/redis.ts).
#   * Kafka: 3-broker KRaft cluster (apache/kafka:3.7.0). The dev ZooKeeper
#     service is parked behind the `legacy-zk` profile and no longer started.
#   * TigerBeetle: 3-replica cluster (cluster 0, replicas 0-2), pinned image.
#   * OpenSearch: 2-node cluster.
#   * MinIO: single-node here; distributed 4-node expansion documented below.
#   * All images pinned to exact tags; dev host ports removed; resource
#     limits and restart policies set; depends_on uses service_healthy.
#
# Secrets come from .env (see .env.example / the `:?` guards in
# docker-compose.yml). Additional prod-only variables:
#   POSTGRES_REPLICATION_PASSWORD  (required) replication role password
#   REDIS_PASSWORD                 (required) master/replica/sentinel auth
#   KAFKA_CLUSTER_ID               (optional; regenerate with
#                                   `kafka-storage.sh random-uuid`)
#   KC_HOSTNAME                    (required) public Keycloak hostname
#   BACKUP_GPG_RECIPIENT           (required for PHI) dump encryption key id
#
# MinIO distributed expansion (when leaving the single node): replace the
# `minio` command with
#   server http://minio-{1...4}/data --console-address ":9001"
# on four hosts/services named minio-1..minio-4, one volume each, and set
# MINIO_DISTRIBUTED=true. Erasure coding requires >= 4 drives; see
# docs/RUNBOOK.md.
#
# RELEASE-BLOCKING: openappsec/nginx has no registry-verifiable versioned
# public tag; before production rollout, mirror it to the internal registry
# and pin by digest (docs/UPGRADES.md workflow). It is the only unpinned
# image in this overlay.
###############################################################################

services:

  # ── PostgreSQL primary ────────────────────────────────────────────────────
  postgres:
    image: postgres:16.4-alpine
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=4
      - -c
      - max_replication_slots=4
      - -c
      - hot_standby=on
      - -c
      - wal_log_hints=on
    environment:
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:?Set POSTGRES_REPLICATION_PASSWORD for the prod overlay}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./infra/postgres/02-replication-init.sh:/docker-entrypoint-initdb.d/02-replication-init.sh:ro
    ports: !reset []        # no host port in prod — app reaches it via idr-net
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }

  # ── PostgreSQL streaming replica (hot standby) ────────────────────────────
  postgres-replica:
    image: postgres:16.4-alpine
    restart: unless-stopped
    networks: [idr-net]
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["bash", "/usr/local/bin/replica-entrypoint.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-idr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:?Set POSTGRES_REPLICATION_PASSWORD}
      PRIMARY_HOST: postgres
      PRIMARY_PORT: "5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./infra/postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    expose:
      - "5432"
    healthcheck:
      # pg_isready succeeds while streaming; also assert this node is a standby.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-idr_user} -q && psql -U ${POSTGRES_USER:-idr_user} -d postgres -tAc 'SELECT pg_is_in_recovery()' | grep -q t"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }

  # ── Redis master ──────────────────────────────────────────────────────────
  redis:
    command: redis-server --requirepass "${REDIS_PASSWORD:?Set REDIS_PASSWORD for the prod overlay}" --appendonly yes --appendfsync everysec
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  # ── Redis replica ─────────────────────────────────────────────────────────
  redis-replica:
    image: redis:7.2.5-alpine
    restart: unless-stopped
    networks: [idr-net]
    depends_on:
      redis:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        redis-server
        --requirepass "$${REDIS_PASSWORD}"
        --masterauth "$${REDIS_PASSWORD}"
        --replicaof redis 6379
        --appendonly yes --appendfsync everysec
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redis_replica_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG && redis-cli -a \"$${REDIS_PASSWORD}\" info replication | grep -q 'role:slave'"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  # ── Redis Sentinels (quorum 2 of 3) ───────────────────────────────────────
  redis-sentinel-1: &sentinel
    image: redis:7.2.5-alpine
    restart: unless-stopped
    networks: [idr-net]
    depends_on:
      redis:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        printf '%s\n'
        'port 26379'
        'sentinel monitor idr-master redis 6379 2'
        'sentinel down-after-milliseconds idr-master 5000'
        'sentinel failover-timeout idr-master 30000'
        'sentinel parallel-syncs idr-master 1'
        "sentinel auth-pass idr-master $${REDIS_PASSWORD}"
        > /tmp/sentinel.conf && exec redis-sentinel /tmp/sentinel.conf
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    expose:
      - "26379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "0.2", memory: 64M }

  redis-sentinel-2:
    <<: *sentinel
  redis-sentinel-3:
    <<: *sentinel

  # ── ZooKeeper: parked in prod (Kafka runs KRaft). Start explicitly with    ─
  #    `--profile legacy-zk` if ever needed for a rollback.                   ─
  zookeeper:
    profiles: ["legacy-zk"]

  # ── Kafka broker 1 (keeps the `kafka` hostname used by clients) ───────────
  kafka:
    image: apache/kafka:3.7.0
    depends_on: !reset {}
    ports: !reset []
    environment: !override
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJEM2Rk}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    expose:
      - "9092"
      - "9093"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  kafka-2: &kafka-broker
    image: apache/kafka:3.7.0
    restart: unless-stopped
    networks: [idr-net]
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJEM2Rk}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka_data_2:/var/lib/kafka/data
    expose:
      - "9092"
      - "9093"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  kafka-3:
    <<: *kafka-broker
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJEM2Rk}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka_data_3:/var/lib/kafka/data

  # ── Topic provisioning with prod replication factor ───────────────────────
  kafka-init:
    image: apache/kafka:3.7.0
    entrypoint: ["/bin/bash", "-c"]
    depends_on:
      kafka:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    command: |
      B="kafka:9092,kafka-2:9092,kafka-3:9092"
      K=/opt/kafka/bin/kafka-topics.sh
      for spec in idr.disputes:6 idr.disputes.state_changes:6 idr.documents:3 idr.offers:3 idr.notifications:3 idr.audit:3 idr.users:3 idr.payments:6 idr.lakehouse.ingest:3 idr.dlq:3; do
        "$K" --bootstrap-server "$B" --create --if-not-exists --topic "${spec%%:*}" --partitions "${spec##*:}" --replication-factor 3
      done
      echo 'Kafka topics created (RF=3).'

  # ── Temporal: pinned, backed by the Postgres primary ──────────────────────
  temporal:
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  # ── Keycloak: production mode against Postgres primary ────────────────────
  keycloak:
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-idr_user}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      KC_HOSTNAME: ${KC_HOSTNAME:?Set KC_HOSTNAME to the public IdP hostname}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports: !reset []        # reachable only via Caddy → openappsec → apisix
    expose:
      - "8080"
      - "9000"
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  # ── Permify: pinned release ───────────────────────────────────────────────
  permify:
    image: ghcr.io/permify/permify:v1.3.5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  # ── OpenSearch node 1: join a 2-node cluster ──────────────────────────────
  opensearch:
    environment: !override
      cluster.name: idr-cluster
      node.name: opensearch-node1
      discovery.seed_hosts: opensearch,opensearch-node2
      cluster.initial_cluster_manager_nodes: opensearch-node1,opensearch-node2
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      # Internal plaintext on idr-net; TLS terminates at Caddy (layer-4 mTLS).
      DISABLE_SECURITY_PLUGIN: "true"
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1536M }

  opensearch-node2:
    image: opensearchproject/opensearch:2.14.0
    restart: unless-stopped
    networks: [idr-net]
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      cluster.name: idr-cluster
      node.name: opensearch-node2
      discovery.seed_hosts: opensearch,opensearch-node2
      cluster.initial_cluster_manager_nodes: opensearch-node1,opensearch-node2
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_SECURITY_PLUGIN: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data_2:/usr/share/opensearch/data
    expose:
      - "9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -E 'green|yellow'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 90s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1536M }

  # ── TigerBeetle 3-replica cluster (cluster id 0) ──────────────────────────
  # First boot formats each replica's data file (guarded, idempotent).
  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.16.50
    command: |
      if [ ! -f /data/0_0.tigerbeetle ]; then
        /tigerbeetle format --cluster=0 --replica=0 --replica-count=3 /data/0_0.tigerbeetle
      fi
      exec /tigerbeetle start --addresses=tigerbeetle:3000,tigerbeetle-1:3000,tigerbeetle-2:3000 /data/0_0.tigerbeetle
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  tigerbeetle-1: &tb-replica
    image: ghcr.io/tigerbeetle/tigerbeetle:0.16.50
    restart: unless-stopped
    networks: [idr-net]
    entrypoint: ["/bin/sh", "-c"]
    command: |
      if [ ! -f /data/0_1.tigerbeetle ]; then
        /tigerbeetle format --cluster=0 --replica=1 --replica-count=3 /data/0_1.tigerbeetle
      fi
      exec /tigerbeetle start --addresses=tigerbeetle:3000,tigerbeetle-1:3000,tigerbeetle-2:3000 /data/0_1.tigerbeetle
    volumes:
      - tigerbeetle_data_1:/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3000 && echo ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  tigerbeetle-2:
    <<: *tb-replica
    command: |
      if [ ! -f /data/0_2.tigerbeetle ]; then
        /tigerbeetle format --cluster=0 --replica=2 --replica-count=3 /data/0_2.tigerbeetle
      fi
      exec /tigerbeetle start --addresses=tigerbeetle:3000,tigerbeetle-1:3000,tigerbeetle-2:3000 /data/0_2.tigerbeetle
    volumes:
      - tigerbeetle_data_2:/data

  # ── MinIO: pinned single-node (distributed expansion documented above) ────
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    ports: !reset []        # console not published in prod
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z

  # ── etcd: pinned official image (bitnami floating tag replaced) ───────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment: !override
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  # ── APISIX / Caddy: keep dev images (already pinned / built locally) ──────
  apisix:
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  # RELEASE-BLOCKING: mirror + digest-pin before production (see header note).
  openappsec:
    image: openappsec/nginx:latest

  # ── Mojaloop simulator: pinned; never started in prod unless the ──────────
  #    `simulation` profile is requested explicitly for a drill.        ──────
  mojaloop-simulator:
    image: mojaloop/simulator:v12.3.6

  # ── App: no host port, dependency-aware healthcheck, Sentinel + cluster ───
  app:
    ports: !reset []
    environment:
      KAFKA_BROKERS: "kafka:9092,kafka-2:9092,kafka-3:9092"
      TIGERBEETLE_ADDRESS: "tigerbeetle:3000,tigerbeetle-1:3000,tigerbeetle-2:3000"
      REDIS_SENTINELS: "redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379"
      REDIS_MASTER_NAME: "idr-master"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      READYZ_TIMEOUT_MS: "2000"
      OPENSEARCH_URL: "http://opensearch:9200"
    healthcheck:
      # Dependency-aware readiness gate (PostgreSQL + Redis).
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:'+(process.env.PORT||3000)+'/readyz').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }

  go-services:
    environment:
      KAFKA_BROKERS: "kafka:9092,kafka-2:9092,kafka-3:9092"
      TIGERBEETLE_ADDRESS: "tigerbeetle:3000,tigerbeetle-1:3000,tigerbeetle-2:3000"
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  rust-services:
    environment:
      KAFKA_BROKERS: "kafka:9092,kafka-2:9092,kafka-3:9092"
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  ai-service:
    environment:
      KAFKA_BROKERS: "kafka:9092,kafka-2:9092,kafka-3:9092"
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  lakehouse-worker:
    environment:
      KAFKA_BROKERS: "kafka:9092,kafka-2:9092,kafka-3:9092"
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  temporal-worker:
    environment:
      KAFKA_BROKERS: "kafka:9092,kafka-2:9092,kafka-3:9092"
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  # ── Scheduled backup (daily pg_dump + Redis RDB + MinIO mirror + retention)
  backup-cron:
    image: postgres:16.4-alpine
    restart: unless-stopped
    networks: [idr-net]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
      - backup_data:/backups
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-idr_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-idr_demo}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
      BACKUP_GPG_RECIPIENT: ${BACKUP_GPG_RECIPIENT:-}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      MC_VERSION: RELEASE.2025-04-16T18-13-26Z
    entrypoint: ["/bin/sh", "-c"]
    command: |
      set -e
      apk add --no-cache gnupg redis >/dev/null
      wget -q "https://dl.min.io/client/mc/release/linux-amd64/archive/mc.${MC_VERSION}" -O /usr/local/bin/mc
      chmod +x /usr/local/bin/mc
      echo "backup-cron: running initial backup, then every $${BACKUP_INTERVAL_SECONDS}s"
      while true; do
        if sh /scripts/backup.sh; then
          echo "backup-cron: backup succeeded"
        else
          echo "backup-cron: BACKUP FAILED" >&2
        fi
        sleep "$${BACKUP_INTERVAL_SECONDS}"
      done
    healthcheck:
      # Healthy iff the last successful backup is newer than 1.5 intervals.
      test: ["CMD-SHELL", "test -f /backups/.last_success && [ $$(( $$(date +%s) - $$(stat -c %Y /backups/.last_success) )) -lt $$(( $${BACKUP_INTERVAL_SECONDS} + $${BACKUP_INTERVAL_SECONDS} / 2 )) ]"]
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 600s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

volumes:
  postgres_replica_data:
  redis_replica_data:
  kafka_data_2:
  kafka_data_3:
  opensearch_data_2:
  tigerbeetle_data_1:
  tigerbeetle_data_2:
  backup_data:

apiVersion: v1
kind: Namespace
metadata:
  name: healthpoint
  labels:
    app.kubernetes.io/part-of: healthpoint
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: healthpoint-api
  namespace: healthpoint
  labels:
    app.kubernetes.io/name: healthpoint-api
    app.kubernetes.io/part-of: healthpoint
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthpoint-api
  namespace: healthpoint
  labels:
    app.kubernetes.io/name: healthpoint-api
    app.kubernetes.io/part-of: healthpoint
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: healthpoint-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: healthpoint-api
        app.kubernetes.io/part-of: healthpoint
        observability.healthpoint.io/scrape: "true"
        dapr.io/enabled: "true"
        dapr.io/app-id: healthpoint-api
        dapr.io/app-port: "3000"
        dapr.io/app-protocol: http
        dapr.io/app-max-concurrency: "64"
        dapr.io/config: healthpoint-dapr-config
        dapr.io/app-token-secret: healthpoint-dapr-app-token
    spec:
      serviceAccountName: healthpoint-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ${HEALTHPOINT_APP_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/telemetry-bootstrap.js"]
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: healthpoint-api-runtime
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: healthpoint-api
            - name: OTEL_DEPLOYMENT_ENVIRONMENT
              value: production
            - name: OTEL_CLIENT_CERT_PATH
              value: /var/run/healthpoint/otel/tls.crt
            - name: OTEL_CLIENT_KEY_PATH
              value: /var/run/healthpoint/otel/tls.key
            - name: OTEL_CA_PATH
              value: /var/run/healthpoint/otel/ca.crt
            - name: DAPR_ENABLED
              value: "true"
            - name: DAPR_PUBSUB_NAME
              value: idr-kafka-pubsub
            - name: DAPR_APP_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: healthpoint-dapr-app-token
                  key: token
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: otel-client-tls
              mountPath: /var/run/healthpoint/otel
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: otel-client-tls
          secret:
            secretName: healthpoint-otel-client-tls
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: healthpoint-api
  namespace: healthpoint
  labels:
    app.kubernetes.io/name: healthpoint-api
    app.kubernetes.io/part-of: healthpoint
    observability.healthpoint.io/scrape: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: healthpoint-api
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: healthpoint-api
  namespace: healthpoint
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: healthpoint-api
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: healthpoint-api-ingress-and-egress
  namespace: healthpoint
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: healthpoint-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-system
      ports:
        - protocol: TCP
          port: 3000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: healthpoint-observability
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: healthpoint-observability
      ports:
        - protocol: TCP
          port: 4318
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: healthpoint-data
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 9094
        - protocol: TCP
          port: 7233
        - protocol: TCP
          port: 3476
        - protocol: TCP
          port: 9200
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 3001
        - protocol: TCP
          port: 2018
        - protocol: TCP
          port: 1880
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keycloak
      ports:
        - protocol: TCP
          port: 8443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: external-secrets
      ports:
        - protocol: TCP
          port: 443

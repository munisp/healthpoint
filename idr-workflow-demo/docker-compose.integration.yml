services:
  postgres:
    image: postgres:16-alpine
    container_name: healthpoint-integration-postgres
    environment:
      POSTGRES_USER: healthpoint
      POSTGRES_PASSWORD: healthpoint-integration-only
      POSTGRES_DB: healthpoint_test
    ports:
      - "15432:5432"
    volumes:
      - healthpoint-integration-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthpoint -d healthpoint_test"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: healthpoint-integration-redis
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "healthpoint-redis-integration",
      ]
    ports:
      - "16379:6379"
    volumes:
      - healthpoint-integration-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "healthpoint-redis-integration", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    container_name: healthpoint-integration-kafka
    ports:
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,EXTERNAL://:19092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 20

  permify:
    image: ghcr.io/permify/permify:v1.7.3
    container_name: healthpoint-integration-permify
    command: ["serve"]
    ports:
      - "13476:3476"
      - "13478:3478"
    healthcheck:
      test: ["CMD", "permify", "version"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.27.2
    container_name: healthpoint-integration-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: healthpoint
      POSTGRES_PWD: healthpoint-integration-only
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "17233:7233"
    volumes:
      - ./infra/temporal/dynamicconfig/development-sql.yaml:/etc/temporal/config/dynamicconfig/development-sql.yaml:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "IP=$(hostname -i | awk '{print $1}'); temporal operator cluster health --address $${IP}:7233 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  healthpoint-integration-postgres:
  healthpoint-integration-redis:
  healthpoint-integration-kafka:
  healthpoint-integration-temporal:

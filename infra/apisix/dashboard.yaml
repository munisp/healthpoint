# APISIX Dashboard 3.0 configuration (mounted as /usr/local/apisix-dashboard/conf/conf.yaml)
#
# SECURITY: apisix-dashboard does NOT expand environment variables in this file.
# The ${APISIX_DASHBOARD_USER} / ${APISIX_DASHBOARD_PASSWORD} values below are
# PLACEHOLDERS that MUST be rendered (e.g. via envsubst) from real secrets at
# deploy time. Do not ship this file unchanged to production.

conf:
  listen:
    host: 0.0.0.0
    port: 9000
  allow_list:
    # Loopback only by default; the dashboard is reachable through the Caddy
    # edge (forward_auth). Add explicit admin CIDRs here if direct access is
    # required — never use 0.0.0.0/0.
    - 127.0.0.1
  etcd:
    endpoints:
      - "http://etcd:2379"
    # mtls / prefix settings left at dashboard defaults
  log:
    error_log:
      level: warn
      file_path: logs/error.log

authentication:
  secret: ${APISIX_DASHBOARD_SECRET:-change-me-dashboard-secret}
  expire_time: 3600
  users:
    - username: ${APISIX_DASHBOARD_USER:-admin}
      password: ${APISIX_DASHBOARD_PASSWORD:-change-me-now}

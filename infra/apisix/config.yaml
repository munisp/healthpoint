apisix:
  node_listen: 9080              # APISIX listening port
  enable_ipv6: false
  enable_admin: true
  enable_dev_mode: false         # Disable for production
  enable_reuseport: true
  enable_server_tokens: false    # Don't leak APISIX version
  proxy_cache:
    cache_ttl: 10s
    zones:
      - name: disk_cache_one
        memory_size: 50m
        disk_size: 1G
        disk_path: /tmp/disk_cache_one
        cache_levels: 1:2
  delete_uri_tail_slash: false
  router:
    http: radixtree_host_uri
    ssl: radixtree_sni
  ssl:
    enable: true
    listen:
      - port: 9443
        enable_http2: true
  admin_listen:
    ip: 0.0.0.0
    port: 9092
  stream_proxy:
    tcp:
      - addr: 9100
  dns_resolver:
    - 127.0.0.53
    - 8.8.8.8
  dns_resolver_valid: 30
  resolver_timeout: 5

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    admin_key:
      # Audit P0-4: the hardcoded admin key was removed. Inject the real key
      # at deploy time via the APISIX_ADMIN_KEY environment variable — render
      # this file with envsubst in the container entrypoint, or mount a
      # rendered copy from a Kubernetes Secret in the Helm chart.
      # NEVER commit the real key.
      - name: admin
        key: ${{APISIX_ADMIN_KEY}}
        role: admin
    # Restrict the admin API to loopback plus the docker-internal bridge
    # range (needed so in-cluster tooling can reach it). 0.0.0.0/0 is
    # never acceptable — audit P0-4.
    allow_admin:
      - 127.0.0.1/32
      - 172.16.0.0/12   # docker bridge network (compose `idr-net`)
    admin_listen:
      ip: 0.0.0.0
      port: 9092
    https_admin: false
    admin_api_mtls:
      admin_ssl_cert: ""
      admin_ssl_cert_key: ""
      admin_ssl_ca_cert: ""
  etcd:
    host:
      - "http://etcd:2379"
    prefix: /apisix
    timeout: 30

plugins:
  - http-logger
  - jwt-auth
  - openid-connect
  - limit-count
  - limit-req
  - limit-conn
  - cors
  - prometheus
  - kafka-logger
  - request-id
  - response-rewrite
  - proxy-rewrite
  - redirect
  - ip-restriction
  - ua-restriction
  - referer-restriction
  - uri-blocker
  - request-validation
  - gzip
  - server-info
  - fault-injection
  - mocking
  - echo
  - proxy-cache

stream_plugins:
  - ip-restriction
  - limit-conn

wasm:
  plugins:
    - name: wasm_log
      priority: 7999
      file: t/wasm/log/main.go.wasm

# open-appsec local policy for HealthPoint IDR platform
# Reference: https://docs.openappsec.io/

policies:
  - name: HealthPoint WAF Policy
    mode: prevent-learn
    practices:
      - name: Web Attacks
        override:
          web-attacks:
            mode: prevent
            confidence-level: high
      - name: "Trusted Sources"
        # Audit P0-5: the docker bridge CIDR 172.16.0.0/12 was removed from
        # trusted sources — it bypassed the WAF for every container on the
        # bridge network. Only localhost remains trusted (health probes).
        override:
          trusted-sources:
            sources:
              - 127.0.0.1/32
            action: detect
      - name: API Security
        override:
          api-security:
            schema-validation: true
            openapi-file: /etc/nginx/openapi.yaml
    triggers:
      - name: Default
        conditions:
          - type: host
            value: "*"

log:
  destination: stdout
  format: json

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

load_module /usr/lib/nginx/modules/ngx_http_openappsec_module.so;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # OpenAppsec WAF configuration
    appsec_enabled on;
    appsec_declare_variable req.http.X-Forwarded-For;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Audit P1-8 (rate-limit consolidation): the nginx `limit_req` zones and
    # directives were removed from this file. Division of labor:
    #   - Caddy (infra/caddy/Caddyfile) = edge per-IP burst, 200 req/min.
    #   - APISIX (infra/apisix/apisix.yaml) = identity-aware quota
    #     (limit-count, applied after openid-connect establishes identity).
    # A third, redundant limiter here only caused divergent 429 behavior.

    upstream apisix_backend {
        server apisix:9080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Health check endpoint (bypass WAF)
        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # Auth endpoints
        location ~ ^/api/auth/ {
            proxy_pass http://apisix_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # All other traffic through WAF
        location / {
            proxy_pass http://apisix_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
        }
    }
}

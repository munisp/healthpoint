###############################################################################
# HealthPoint IDR Platform — Development and Integration Stack Only
# This file is not a production deployment baseline. Use the production overlay
# only with mandatory production secrets and non-simulator provider endpoints.
###############################################################################
# RELEASE-BLOCKING ACTION ITEM: the following images use unpinned mutable
# tags (`latest`). Before any release, replace each with a registry-verified
# immutable digest (image@sha256:...):
#   - ghcr.io/permify/permify:latest    (permify)
#   - minio/minio:latest                (minio)
#   - minio/mc:latest                   (minio-init)
#   - mojaloop/simulator:latest         (mojaloop-simulator)
#   - openappsec/nginx:latest           (openappsec)
# (tigerbeetle was pinned to 0.17.6 below — audit P1-11.)
###############################################################################
# NOTE: Dapr and Fluvio were removed on 2026-09-05 (zero application adoption;
# orphaned infrastructure). The application talks to Kafka/Redis/Temporal
# directly. See docs/UPGRADES.md for the image pinning workflow.
###############################################################################
# CREDENTIAL POLICY: the `app` and `migrate` services run NODE_ENV=production.
# They must never fall back to the data-store containers' development default
# passwords, so their DATABASE_URL / REDIS_URL / S3 credentials use compose's
# `:?` required-variable form. Set POSTGRES_PASSWORD / REDIS_PASSWORD /
# MINIO_ACCESS_KEY / MINIO_SECRET_KEY / KC_ADMIN_PASSWORD in .env (compose
# auto-loads it); the same values feed the infra containers' defaults.
###############################################################################
version: "3.9"

networks:
  idr-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  opensearch_data:
  temporal_data:
  minio_data:
  tigerbeetle_data:
  permify_data:
  caddy_data:
  caddy_config:

###############################################################################
# CORE DATA STORES
###############################################################################
services:

  # ── PostgreSQL 16 (primary OLTP) ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [idr-net]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-idr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-idr_pass123}
      POSTGRES_DB: ${POSTGRES_DB:-idr_demo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"   # DEV ONLY: host access for local tooling; remove in production overlay
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-idr_user} -d ${POSTGRES_DB:-idr_demo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 7 (cache, sessions, distributed locks, pub/sub) ─────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [idr-net]
    # Audit P1-12: added memory ceiling + LRU eviction (previously unbounded),
    # AOF fsync every second, and a larger TCP backlog for burst fan-in.
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pass123} --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --appendfsync everysec --tcp-backlog 511
    volumes:
      - redis_data:/data
    # Internal only — reached via idr-net (app) and via Caddy
    # layer-4 mTLS (host port 6380). Not published directly.
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_pass123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

###############################################################################
# MESSAGING / STREAMING
###############################################################################

  # ── Zookeeper (Kafka dependency) ──────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    restart: unless-stopped
    networks: [idr-net]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka 3.7 (event backbone) ────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    networks: [idr-net]
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Audit P1-10: auto topic creation disabled — kafka-init provisions all
      # topics with explicit partitions/replication; auto-created topics got
      # broker defaults and masked misconfiguration.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Kafka topic initializer ───────────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    networks: [idr-net]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic idr.disputes --partitions 6 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic idr.disputes.state_changes --partitions 6 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic idr.documents --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic idr.offers --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic idr.notifications --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic idr.audit --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic idr.users --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic idr.payments --partitions 6 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic idr.lakehouse.ingest --partitions 3 --replication-factor 1
      # Dead-letter queue — server consumer routes poison messages here
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic idr.dlq --partitions 3 --replication-factor 1
      echo 'Kafka topics created.'
    restart: on-failure

###############################################################################
# WORKFLOW ORCHESTRATION
###############################################################################

  # ── Temporal server (durable workflow engine) ─────────────────────────────
  temporal:
    image: temporalio/auto-setup:1.24.2
    restart: unless-stopped
    networks: [idr-net]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-idr_user}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-idr_pass123}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/development-sql.yaml
    volumes:
      - ./infra/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 cluster health 2>/dev/null | grep SERVING || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  # NOTE: temporal-ui and opensearch-dashboards are convenience dashboards
  # whose images carry no reliable curl/wget; they are excluded from the
  # healthcheck chain intentionally (verify via browser / runbook commands).
  temporal-ui:
    image: temporalio/ui:2.26.2
    restart: unless-stopped
    networks: [idr-net]
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8088:8080"   # DEV ONLY: also reachable via temporal.healthpoint.example.com through Caddy

  temporal-admin-tools:
    image: temporalio/admin-tools:1.24.2
    restart: unless-stopped
    networks: [idr-net]
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    entrypoint: ["/bin/bash", "-c"]
    command: |
      sleep 15 && tctl --namespace default namespace register --retention 30 2>/dev/null || true && tail -f /dev/null
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 cluster health 2>/dev/null | grep -q SERVING || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

###############################################################################
# IDENTITY & AUTHORIZATION
###############################################################################

  # ── Keycloak 26 (OIDC identity provider) ─────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    restart: unless-stopped
    networks: [idr-net]
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      # No default admin password — set KC_ADMIN_PASSWORD explicitly (the
      # `start-dev` mode itself is development-only and must not reach prod).
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?Set KC_ADMIN_PASSWORD before starting the Keycloak dev container}
      KC_DB: dev-mem
      KC_HTTP_PORT: 8080
      # Runtime health endpoints on management port 9000 (the Keycloak image
      # ships no curl/wget — healthcheck uses bash /dev/tcp below).
      KC_HEALTH_ENABLED: "true"
    volumes:
      # Canonical realm export (realm: healthpoint). Previously ./keycloak,
      # which does not exist in this layout — see middleware/keycloak/.
      - ./middleware/keycloak:/opt/keycloak/data/import
    ports:
      - "8080:8080"   # DEV ONLY: admin console also available via keycloak.healthpoint.example.com through Caddy; remove in production overlay
    healthcheck:
      # The keycloak image (ubi-micro based) has no curl/wget; probe the
      # management-port readiness endpoint over a raw bash TCP socket.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9000 && printf \"GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s

  # ── Permify (fine-grained ReBAC authorization) ────────────────────────────
  permify:
    image: ghcr.io/permify/permify:latest
    restart: unless-stopped
    networks: [idr-net]
    depends_on:
      postgres:
        condition: service_healthy
    command: serve
    environment:
      PERMIFY_DATABASE_ENGINE: postgres
      PERMIFY_DATABASE_URI: "postgres://${POSTGRES_USER:-idr_user}:${POSTGRES_PASSWORD:-idr_pass123}@postgres:5432/${POSTGRES_DB:-idr_demo}?sslmode=disable"
      PERMIFY_DATABASE_POOL_MAX: 20
      PERMIFY_SERVER_PORT: 3476
      PERMIFY_SERVER_GRPC_PORT: 3478
      PERMIFY_LOG_LEVEL: info
    volumes:
      - permify_data:/var/lib/permify
      - ./infra/permify/schema.perm:/etc/permify/schema.perm:ro
    # Internal only — app and go-services reach Permify over idr-net.
    expose:
      - "3476"   # HTTP
      - "3478"   # gRPC
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3476/healthz | grep SERVING"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

###############################################################################
# SEARCH & ANALYTICS
###############################################################################

  # ── OpenSearch 2.x (full-text search + analytics) ─────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.14.0
    restart: unless-stopped
    networks: [idr-net]
    environment:
      cluster.name: idr-cluster
      node.name: opensearch-node1
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      # Audit P1-14: heap raised from 512m to 2g.
      OPENSEARCH_JAVA_OPTS: "-Xms2g -Xmx2g"
      # Audit P1-14: the security plugin stays DISABLED for local dev only.
      # PRODUCTION (uncomment in the production overlay and provide certs):
      #   DISABLE_SECURITY_PLUGIN: "false"
      #   OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:?required}
      #   plugins.security.ssl.transport.pemcert_filepath: /usr/share/opensearch/config/node.pem
      #   plugins.security.ssl.transport.pemkey_filepath: /usr/share/opensearch/config/node-key.pem
      #   plugins.security.ssl.transport.pemtrustedcas_filepath: /usr/share/opensearch/config/root-ca.pem
      #   plugins.security.ssl.http.enabled: "true"
      DISABLE_SECURITY_PLUGIN: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    # Internal only — consumers reach OpenSearch over idr-net; host access
    # goes through the Caddy layer-4 mTLS listener on port 9201. The
    # performance-analyzer port 9600 is NOT published (audit P0-4).
    expose:
      - "9200"
      - "9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -E 'green|yellow'"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.14.0
    restart: unless-stopped
    networks: [idr-net]
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"

###############################################################################
# FINANCIAL LEDGER
###############################################################################

  # ── TigerBeetle (double-entry financial ledger) ───────────────────────────
  tigerbeetle:
    # Audit P1-11: pinned to a concrete release tag (was :latest).
    # 0.17.6 is the latest release in the 0.17 line as of 2026-09
    # (github.com/tigerbeetle/tigerbeetle releases).
    image: ghcr.io/tigerbeetle/tigerbeetle:0.17.6
    restart: unless-stopped
    networks: [idr-net]
    volumes:
      - tigerbeetle_data:/data
    entrypoint: ["/bin/sh", "-c"]
    command: |
      if [ ! -f /data/0_0.tigerbeetle ]; then
        /tigerbeetle format --cluster=0 --replica=0 --replica-count=1 /data/0_0.tigerbeetle
      fi
      /tigerbeetle start --addresses=0.0.0.0:3000 /data/0_0.tigerbeetle
    # Internal only — app/go-services use idr-net; host access goes through
    # the Caddy layer-4 mTLS listener on port 3001.
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3000 && echo ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

###############################################################################
# OBJECT STORAGE (Lakehouse)
###############################################################################

  # ── MinIO (S3-compatible object storage for Lakehouse) ────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    networks: [idr-net]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio_secret123}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"   # MinIO console (DEV ONLY: remove in production overlay)
    # S3 API (9000) is internal only — lakehouse-worker, ai-service and the
    # app reach it over idr-net.
    expose:
      - "9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    networks: [idr-net]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minio_admin} ${MINIO_SECRET_KEY:-minio_secret123}
      mc mb --ignore-existing local/idr-lakehouse
      mc mb --ignore-existing local/idr-documents
      mc mb --ignore-existing local/idr-exports
      mc anonymous set download local/idr-exports
      echo 'MinIO buckets created.'
    restart: on-failure

###############################################################################
# API GATEWAY & SECURITY
###############################################################################

  # ── etcd (APISIX dependency) ──────────────────────────────────────────────
  etcd:
    image: bitnami/etcd:3.5
    restart: unless-stopped
    networks: [idr-net]
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
    # Internal only — only APISIX and apisix-dashboard talk to etcd.
    expose:
      - "2379"
    healthcheck:
      test: ["CMD-SHELL", "etcdctl endpoint health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── APISIX 3.x (API gateway) ──────────────────────────────────────────────
  apisix:
    image: apache/apisix:3.9.1-debian
    restart: unless-stopped
    networks: [idr-net]
    depends_on:
      etcd:
        condition: service_healthy
    volumes:
      - ./infra/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./infra/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - "9080:9080"   # HTTP gateway
      - "9443:9443"   # HTTPS gateway
    # Admin API (9092) is NOT published — in-cluster only via `expose`.
    # Restricted to loopback by deployment.admin.allow_admin in config.yaml.
    expose:
      - "9092"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9080/apisix/status | grep ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── APISIX Dashboard ──────────────────────────────────────────────────────
  apisix-dashboard:
    image: apache/apisix-dashboard:3.0.1-alpine
    restart: unless-stopped
    networks: [idr-net]
    depends_on: [apisix]
    volumes:
      - ./infra/apisix/dashboard.yaml:/usr/local/apisix-dashboard/conf/conf.yaml:ro
    # Audit P0-4: host port moved 9000 -> 9002 to avoid the collision with the
    # MinIO S3 API (9000). dashboard.yaml listens on 9002 as well.
    ports:
      - "9002:9002"   # DEV ONLY: render dashboard.yaml placeholders before production use
    healthcheck:
      # alpine image: busybox wget is available.
      test: ["CMD-SHELL", "wget -qO- http://localhost:9002/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── OpenAppsec WAF (NGINX-based ML WAF) ─────────────────────────────────
  # Sits between Caddy and APISIX: Caddy → OpenAppsec → APISIX → App
  openappsec:
    image: openappsec/nginx:latest
    restart: unless-stopped
    networks: [idr-net]
    depends_on: [apisix]
    volumes:
      - ./infra/openappsec/local_policy.yaml:/ext/appsec/local_policy.yaml:ro
      - ./infra/openappsec/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/openappsec/openapi.yaml:/etc/nginx/openapi.yaml:ro
    environment:
      OPENAPPSEC_UPSTREAM: "http://apisix:9080"
      OPENAPPSEC_MODE: prevent-learn
    # No direct port exposure — traffic arrives from Caddy only
    expose:
      - "80"
    healthcheck:
      # nginx.conf serves /health (not /healthz) — audit P0-3.
      test: ["CMD-SHELL", "curl -sf http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

###############################################################################
# EDGE LAYER — CADDY
###############################################################################

  # ── Caddy (TLS termination, HTTP/3, Coraza WAF, Keycloak forward_auth) ──────
  # Traffic flow: Internet → Caddy → OpenAppsec → APISIX → App
  # Layer 4:       Clients → Caddy (mTLS) → Kafka/Temporal/TigerBeetle/Redis
  caddy:
    build:
      context: ./infra/caddy
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [idr-net]
    depends_on:
      openappsec:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infra/caddy/layer4.json:/etc/caddy/layer4.json:ro
      - ./infra/caddy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Override the domain for local dev (uses localhost with self-signed cert)
      CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
      # Optional: Cloudflare API token for ACME DNS challenge (wildcard certs)
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      SETTLEMENT_MTLS_CA_FILE: /run/secrets/settlement_mtls_ca
      SETTLEMENT_MTLS_INGRESS_TOKEN: "${SETTLEMENT_MTLS_INGRESS_TOKEN:?Set SETTLEMENT_MTLS_INGRESS_TOKEN before starting settlement ingress}"
    secrets:
      - settlement_mtls_ca
    # Admin API (2019) is NOT published on the host — in-cluster only via
    # `expose` (used by entrypoint.sh to load the layer4 config). Audit P0-4.
    expose:
      - "2019"
    ports:
      - "80:80"         # HTTP → HTTPS redirect
      - "443:443"       # HTTPS (HTTP/1.1 + HTTP/2)
      - "443:443/udp"   # HTTP/3 (QUIC)
      # Layer 4 TLS-terminated TCP ports
      - "9093:9093"     # Kafka (mTLS)
      - "7234:7234"     # Temporal gRPC (mTLS)
      - "3001:3001"     # TigerBeetle (mTLS via go-services)
      - "6380:6380"     # Redis (mTLS)
      - "9201:9201"     # OpenSearch (mTLS)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2019/config/ | grep -q '.' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

###############################################################################
# PAYMENT INTEROPERABILITY
###############################################################################

  # ── Mojaloop simulator (payment hub) ─────────────────────────────────────
  mojaloop-simulator:
    image: mojaloop/simulator:latest
    restart: unless-stopped
    profiles: ["simulation"]
    networks: [idr-net]
    environment:
      SIMULATOR_ENDPOINT: http://mojaloop-simulator:3003
      LOG_LEVEL: info
    ports:
      - "3003:3003"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3003/health | grep ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

###############################################################################
# APPLICATION SERVICES
###############################################################################

  # ── Main HealthPoint Node.js app ──────────────────────────────────────────
  # NOTE: `migrate` and `app` run NODE_ENV=production — they require explicit
  # credentials (`:?`) and never use the infra containers' dev defaults.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    networks: [idr-net]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-idr_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example) — production-mode services must not use the dev default password}@postgres:5432/${POSTGRES_DB:-idr_demo}"
    command: ["sh", "-c", "pnpm drizzle-kit migrate"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [idr-net]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-idr_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example) — production-mode services must not use the dev default password}@postgres:5432/${POSTGRES_DB:-idr_demo}"
      SETTLEMENT_CALLBACK_SECRET: "${SETTLEMENT_CALLBACK_SECRET:?Set SETTLEMENT_CALLBACK_SECRET before starting the production app}"
      SETTLEMENT_CALLBACK_KEYRING: "${SETTLEMENT_CALLBACK_KEYRING:?Set SETTLEMENT_CALLBACK_KEYRING before starting the production app}"
      SETTLEMENT_MTLS_CLIENT_CA_PEM: "${SETTLEMENT_MTLS_CLIENT_CA_PEM:?Set SETTLEMENT_MTLS_CLIENT_CA_PEM before starting the production app}"
      SETTLEMENT_MTLS_CLIENT_FINGERPRINTS: "${SETTLEMENT_MTLS_CLIENT_FINGERPRINTS:?Set SETTLEMENT_MTLS_CLIENT_FINGERPRINTS before starting the production app}"
      SETTLEMENT_MTLS_INGRESS_TOKEN: "${SETTLEMENT_MTLS_INGRESS_TOKEN:?Set SETTLEMENT_MTLS_INGRESS_TOKEN before starting the production app}"
      SETTLEMENT_CALLBACK_PROVIDER: "${SETTLEMENT_CALLBACK_PROVIDER:-mojaloop}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (see .env.example) — production-mode services must not use the dev default password}@redis:6379"
      KAFKA_BROKERS: "kafka:9092"
      KEYCLOAK_URL: "http://keycloak:8080"
      PERMIFY_GRPC_URL: "permify:3478"
      # server/authz.ts reads PERMIFY_URL (REST) — keep in sync with PERMIFY_GRPC_URL
      PERMIFY_URL: "http://permify:3476"
      OPENSEARCH_URL: "http://opensearch:9200"
      TEMPORAL_ADDRESS: "temporal:7233"
      TIGERBEETLE_ADDRESS: "tigerbeetle:3000"
      MOJALOOP_URL: "http://mojaloop-simulator:3003"
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY: "${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env (see .env.example)}"
      S3_SECRET_KEY: "${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env (see .env.example)}"
      S3_BUCKET: "idr-documents"
    ports:
      - "3000:3000"   # DEV ONLY: remove in production overlay — traffic enters via Caddy → OpenAppsec → APISIX
    healthcheck:
      # node:22-slim ships no curl/wget; use Node's built-in fetch against the
      # liveness endpoint. Readiness of dependencies is gated by depends_on
      # above plus /readyz (used by the prod overlay).
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:'+(process.env.PORT||3000)+'/healthz').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Python AI service (LangGraph agents) ─────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [idr-net]
    depends_on:
      - kafka
      - opensearch
    environment:
      AI_SERVICE_PORT: "8000"
      KAFKA_BROKERS: "kafka:9092"
      OPENSEARCH_URL: "http://opensearch:9200"
      LLM_API_URL: "${LLM_API_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health | grep -q '\"status\":\"healthy\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Python Lakehouse ingestion pipeline ───────────────────────────────────
  lakehouse-worker:
    build:
      context: ./services/lakehouse
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [idr-net]
    depends_on:
      - kafka
      - minio
      - opensearch
    environment:
      KAFKA_BROKERS: "kafka:9092"
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minio_admin}"
      S3_SECRET_KEY: "${MINIO_SECRET_KEY:-minio_secret123}"
      OPENSEARCH_URL: "http://opensearch:9200"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-idr_user}:${POSTGRES_PASSWORD:-idr_pass123}@postgres:5432/${POSTGRES_DB:-idr_demo}"
      # services/lakehouse/pipeline.py reads MINIO_* and a JDBC POSTGRES_URL;
      # S3_* above are kept for backward compatibility with other tooling.
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minio_admin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minio_secret123}"
      POSTGRES_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-idr_demo}"
      POSTGRES_USER: "${POSTGRES_USER:-idr_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-idr_pass123}"
    healthcheck:
      # Long-running consumer with no HTTP listener: verify the worker
      # container can still reach Kafka and MinIO (its two hard dependencies).
      test: ["CMD-SHELL", "python -c \"import socket\nfor h,p in [('kafka',9092),('minio',9000)]:\n s=socket.create_connection((h,p),3); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Python Temporal workflow workers ──────────────────────────────────────
  temporal-worker:
    build:
      context: ./services/temporal-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [idr-net]
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: "temporal:7233"
      # services/temporal-worker/worker.py reads TEMPORAL_HOST (not
      # TEMPORAL_ADDRESS); both are provided so server and worker align with
      # the server/temporal.ts defaults.
      TEMPORAL_HOST: "temporal:7233"
      TEMPORAL_TASK_QUEUE: "healthpoint-idr"
      TEMPORAL_NAMESPACE: "default"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-idr_user}:${POSTGRES_PASSWORD:-idr_pass123}@postgres:5432/${POSTGRES_DB:-idr_demo}"
      KAFKA_BROKERS: "kafka:9092"
    healthcheck:
      # No HTTP listener: verify the Temporal gRPC frontend is reachable from
      # inside the worker container (a dead network/namespace == dead worker).
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('temporal',7233),3); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Go services (Permify client, Mojaloop connector, TigerBeetle ledger) ──
  go-services:
    build:
      context: ./services/go
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [idr-net]
    depends_on:
      - permify
      - tigerbeetle
      - kafka
    environment:
      GO_ENV: development
      ALLOW_INSECURE_INTERNAL_TRANSPORT: "true"
      PERMIFY_GRPC_URL: "permify:3478"
      PERMIFY_GRPC_TLS: "false"
      TIGERBEETLE_ADDRESS: "tigerbeetle:3000"
      KAFKA_BROKERS: "kafka:9092"
      PAYMENT_EXECUTION_MODE: disabled
      GO_SERVICES_PORT: "8001"
      # Payment execution remains fail-closed in the development topology.
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN before enabling payment execution}"
    ports:
      - "8001:8001"
    # NOTE: the go-services image is distroless (no shell/curl), so Docker
    # cannot exec an in-container healthcheck. Liveness is verified
    # externally: GET http://localhost:8001/internal/health (see RUNBOOK.md).

  # ── Rust services (high-perf Kafka event handlers) ───────────────────────
  # NOTE: Fluvio was removed from this stack (orphan infrastructure). The
  # Rust services are pure rdkafka consumers/producers.
  rust-services:
    build:
      context: ./services/rust
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [idr-net]
    depends_on:
      - kafka
    environment:
      KAFKA_BROKERS: "kafka:9092"
      RUST_LOG: "info"
      RUST_SERVICES_PORT: "8002"
    ports:
      - "8002:8002"
    healthcheck:
      # debian:bookworm-slim has bash but no curl; probe the TCP listener.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8002"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

secrets:
  settlement_mtls_ca:
    environment: SETTLEMENT_MTLS_CLIENT_CA_PEM

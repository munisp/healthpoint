# Production deployment contract for externally managed services.
# Do not merge this file with docker-compose.yml: that file is development-only
# and intentionally contains local simulators and insecure integration defaults.
services:
  app:
    image: "${HEALTHPOINT_APP_IMAGE:?Set immutable HealthPoint application image digest}"
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      DATABASE_URL: "${DATABASE_URL:?Set an SSL-enabled managed PostgreSQL URL}"
      JWT_SECRET: "${JWT_SECRET:?Set a 32+ character production JWT secret}"
      SETTLEMENT_CALLBACK_KEYRING: "${SETTLEMENT_CALLBACK_KEYRING:?Set versioned callback keyring JSON}"
      SETTLEMENT_MTLS_CLIENT_CA_PEM: "${SETTLEMENT_MTLS_CLIENT_CA_PEM:?Set provider CA PEM}"
      SETTLEMENT_MTLS_CLIENT_FINGERPRINTS: "${SETTLEMENT_MTLS_CLIENT_FINGERPRINTS:?Set provider certificate fingerprints}"
      SETTLEMENT_MTLS_INGRESS_TOKEN: "${SETTLEMENT_MTLS_INGRESS_TOKEN:?Set trusted mTLS ingress token}"
      BACKUP_ENCRYPTION_PASSPHRASE: "${BACKUP_ENCRYPTION_PASSPHRASE:?Set backup encryption passphrase}"
      EMR_CREDENTIALS_ENCRYPTION_KEY: "${EMR_CREDENTIALS_ENCRYPTION_KEY:?Set a 64-character hexadecimal AES-256 key}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?Set internal service token}"
      PAYMENT_EXECUTION_MODE: "${PAYMENT_EXECUTION_MODE:?Set disabled or sandbox; live initiation is not implemented}"
      MOJALOOP_URL: "${MOJALOOP_URL:?Set HTTPS provider/FSP sandbox URL}"
      ALLOW_INSECURE_INTERNAL_TRANSPORT: "false"
    networks:
      - healthpoint-internal
    expose:
      - "3000"

  go-services:
    image: "${HEALTHPOINT_GO_IMAGE:?Set immutable HealthPoint Go sidecar image digest}"
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      GO_ENV: production
      PERMIFY_GRPC_TLS: "true"
      PERMIFY_GRPC_URL: "${PERMIFY_GRPC_URL:?Set TLS Permify endpoint}"
      TIGERBEETLE_ADDRESS: "${TIGERBEETLE_ADDRESS:?Set internal TigerBeetle endpoint}"
      KAFKA_BROKERS: "${KAFKA_BROKERS:?Set authenticated Kafka endpoint}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?Set internal service token}"
      PAYMENT_EXECUTION_MODE: "${PAYMENT_EXECUTION_MODE:?Set disabled or sandbox; live initiation is not implemented}"
      MOJALOOP_URL: "${MOJALOOP_URL:?Set HTTPS provider/FSP sandbox URL}"
      ALLOW_INSECURE_INTERNAL_TRANSPORT: "false"
    networks:
      - healthpoint-internal
    expose:
      - "3001"

networks:
  healthpoint-internal:
    external: true
